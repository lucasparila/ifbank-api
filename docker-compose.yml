services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: ifbank_oracle_container
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: senha123
      APP_USER: ifbank_database
      APP_USER_PASSWORD: senha123
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - ifbank-network

  api-ifbank:
    build: .
    container_name: ifbank_spring_container
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USER: ifbank_database
      DB_PASSWORD: senha123
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - oracle-db
    networks:
      - ifbank-network

volumes:
  oracle_data:
  uploads_data:

networks:
  ifbank-network:
    driver: bridge