spring.application.name=api-ifbank

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:ifbank_database}
spring.datasource.password=${DB_PASSWORD:senha123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.servlet.context-path=/

logging.level.org.springframework.web=info
logging.level.org.hibernate.SQL=debug